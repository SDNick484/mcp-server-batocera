name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for the shared-drift job's --latest check (below). A schedule runs the
  # whole workflow, so the other jobs also catch a dependency release that breaks us.
  schedule:
    - cron: "0 8 * * 1"  # Mondays 8:00
      timezone: America/Los_Angeles  # 8 a.m. Pacific all year, across daylight saving
  workflow_dispatch:  # a "Run workflow" button: also runs the --latest check

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  # The command-line install on Alpine (musl), in a stock container: deploy/alpine/smoke-test.sh.
  # ARCADE_REF has it also run setup-arcade.sh, which installs both arcade servers from GitHub at
  # that ref. Changes to both kits go on same-named branches, so CI tests them together.
  alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-arcade.sh installs both repos at one ref. A branch only this repo has (most PRs) has no
      # mcp-server-pixelcade counterpart, so it falls back to main. The branch name comes in through
      # env, not ${{ }} in the script: a PR's branch name is untrusted text.
      - name: Pick the ref setup-arcade.sh installs
        id: ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ref="$BRANCH"
          git ls-remote --exit-code --heads https://github.com/SDNick484/mcp-server-pixelcade "refs/heads/$ref" >/dev/null || ref=main
          echo "setup-arcade.sh will install: $ref"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
      - env:
          ARCADE_REF: ${{ steps.ref.outputs.ref }}
        run: docker run --rm -v "$PWD:/src" -w /src -e ARCADE_REF python:3.12-alpine sh deploy/alpine/smoke-test.sh

  # The files shared with the sibling servers (shared.lock lists which) must match
  # mcp-server-shared. See that repo's README.
  shared-drift:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}  # for api.github.com's rate limit; raw files are fetched without it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # the oldest supported: keeps the stdlib-only script honest
      - name: Shared files match the locked commit
        run: python scripts/sync_shared.py --check
      - name: Shared files match mcp-server-shared main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/sync_shared.py --check --latest
